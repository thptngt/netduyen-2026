<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 440" role="img" aria-label="Biểu tượng Người gieo mầm">
  <!-- Biểu tượng riêng của cuộc thi "Nét Duyên Người Gieo Mầm": cô giáo giữa đôi cánh, nâng mầm cây -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe2a6"/>
      <stop offset=".45" stop-color="#d9973f"/>
      <stop offset=".75" stop-color="#f4c06e"/>
      <stop offset="1" stop-color="#b8762c"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cc80"/>
      <stop offset=".55" stop-color="#d08636"/>
      <stop offset="1" stop-color="#eeb262"/>
    </linearGradient>
    <linearGradient id="featherA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7d1a0"/>
      <stop offset=".6" stop-color="#fffbf2"/>
      <stop offset="1" stop-color="#f3e6c6"/>
    </linearGradient>
    <linearGradient id="featherB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9bb7c"/>
      <stop offset="1" stop-color="#f6e7c2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a3a"/>
      <stop offset="1" stop-color="#ffe6a3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7a4a1a" flood-opacity=".25"/>
    </filter>
    <!-- Lông vũ lớn (lớp ngoài) và lông vũ nhỏ (lớp trong), gốc tại (0,0), hướng sang phải -->
    <g id="fa">
      <path d="M0 0 C26 -30 104 -44 160 -18 C108 10 38 14 0 0Z" fill="url(#featherA)" stroke="#cfab66" stroke-width="1.6"/>
      <path d="M6 -2 C56 -12 106 -18 152 -18" fill="none" stroke="#c4964e" stroke-width="1.4" opacity=".75"/>
      <path d="M50 -9 l13 -12 M78 -12 l14 -12 M106 -14 l14 -10 M50 -8 l12 9 M78 -11 l13 9 M106 -14 l12 8" stroke="#dcc08a" stroke-width="1.1" opacity=".75"/>
    </g>
    <g id="fb">
      <path d="M0 0 C18 -22 70 -32 108 -14 C72 6 26 10 0 0Z" fill="url(#featherB)" stroke="#c49a52" stroke-width="1.3"/>
      <path d="M5 -2 C38 -8 72 -12 102 -13" fill="none" stroke="#b9883f" stroke-width="1.1" opacity=".7"/>
    </g>
    <g id="wing">
      <use xlink:href="#fa" transform="rotate(-58) scale(.86)"/>
      <use xlink:href="#fa" transform="rotate(-42) scale(.98)"/>
      <use xlink:href="#fa" transform="rotate(-26) scale(1.06)"/>
      <use xlink:href="#fa" transform="rotate(-10) scale(1.06)"/>
      <use xlink:href="#fa" transform="rotate(6) scale(.96)"/>
      <use xlink:href="#fa" transform="rotate(21) scale(.8)"/>
      <use xlink:href="#fb" transform="rotate(-48)"/>
      <use xlink:href="#fb" transform="rotate(-30)"/>
      <use xlink:href="#fb" transform="rotate(-12)"/>
      <use xlink:href="#fb" transform="rotate(6) scale(.9)"/>
    </g>
  </defs>

  <g filter="url(#soft)">
    <!-- Đôi cánh, gốc ở hai bên vai -->
    <use xlink:href="#wing" transform="translate(216 186)"/>
    <use xlink:href="#wing" transform="translate(204 186) scale(-1 1)"/>

    <!-- Dải lụa vàng: từ đôi tay vòng ra ngoài rồi buông xuống -->
    <path d="M196 118 C150 96 112 128 132 170 C146 198 176 204 170 244 C166 270 142 284 120 286"
          fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M224 118 C270 96 308 128 288 170 C274 198 244 204 250 244 C254 270 278 284 300 286"
          fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Dáng người: búi tóc, đầu, hai tay nâng lên, váy dài thon có đuôi bay -->
    <g fill="url(#goldV)">
      <ellipse cx="210" cy="140" rx="7.5" ry="6"/>
      <circle cx="210" cy="154" r="11.5"/>
      <path d="M203 172 C196 156 190 138 188 122 C187 116 193 114 195 119 C198 134 205 152 209 166Z"/>
      <path d="M217 172 C224 156 230 138 232 122 C233 116 227 114 225 119 C222 134 215 152 211 166Z"/>
      <path d="M200 166 C202 176 204 186 202 198 C199 216 196 242 198 272 C200 306 204 344 210 388
               C213 360 218 326 222 292 C225 266 224 232 219 206 C216 192 217 178 220 166
               C214 170 206 170 200 166Z"/>
      <path d="M210 388 C216 400 230 408 246 410 C228 403 218 393 214 376Z" opacity=".9"/>
    </g>

    <!-- Mầm cây nằm ngay trên đôi tay -->
    <g transform="translate(210 122)">
      <path d="M0 0 C0 -10 0 -20 0 -30" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 -20 C-7 -38 -28 -42 -40 -33 C-30 -21 -13 -15 0 -20Z" fill="url(#leaf)" stroke="#b8762c" stroke-width="1.2"/>
      <path d="M0 -27 C7 -48 30 -54 45 -43 C32 -29 15 -23 0 -27Z" fill="url(#leaf)" stroke="#b8762c" stroke-width="1.2"/>
      <path d="M-32 -32 C-21 -29 -11 -24 -2 -21 M35 -42 C24 -37 13 -31 2 -28" stroke="#fff3cf" stroke-width="1.2" fill="none" opacity=".9"/>
    </g>
    <!-- Lấp lánh -->
    <g fill="#fff3cc">
      <path d="M210 40 l3.5 10 l10 3.5 l-10 3.5 l-3.5 10 l-3.5 -10 l-10 -3.5 l10 -3.5Z"/>
      <path d="M160 70 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2Z" opacity=".85"/>
      <path d="M262 66 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2Z" opacity=".85"/>
    </g>
  </g>
</svg>
